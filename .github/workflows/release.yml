name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-and-release:
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '>=1.25.0'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.12.0

      - name: Install NSIS
        run: choco install nsis --yes

      - name: Build NSIS installer
        run: wails build --nsis

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Sinhala Assistant ${{ github.ref_name }}"
          body: |
            ## Sinhala Assistant ${{ github.ref_name }}

            Type Sinhala Unicode in any Windows application using your regular keyboard.

            ### Download
            - **`sinhala-assistant-amd64-installer.exe`** — Windows installer (recommended)

            ### How to install
            1. Download the installer below.
            2. Double-click and follow the wizard.
            3. Launch from the Desktop or Start Menu shortcut.

            See [HOW_TO_USE.md](https://github.com/PasinduVithanage/sinhala-typing/blob/main/HOW_TO_USE.md) for the full user guide.
          files: build/bin/sinhala-assistant-amd64-installer.exe
          fail_on_unmatched_files: true
